<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Imperadores · Sistema de Feedbacks</title>
<style>
  :root{
    --bg:#0a1018; --card:#151f2e; --card2:#1b2738; --line:#24334a;
    --text:#e9f0fa; --muted:#8798b0;
    --gold:#f5c518; --green:#22c55e; --purple:#a855f7; --red:#ef4444;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#132033 0%,var(--bg) 55%);
    color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
    padding:24px 16px 60px;
  }
  .wrap{max-width:880px;margin:0 auto}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input, select, textarea {
    width: 100%; background: #0c1420; border: 1px solid var(--line); color: var(--text);
    padding: 12px 14px; border-radius: 10px; font-family: inherit; font-size: 14px; outline: none; margin-bottom: 12px;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }

  /* ---------- SELEÇÃO ---------- */
  .hero{text-align:center;margin:24px 0 36px; display:flex; flex-direction:column; align-items:center; position: relative;}
  .brand-logo{max-width:180px; width:100%; height:auto; margin-bottom:24px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6)); transition: transform 0.3s ease; display: none;}
  .brand-logo.loaded { display: block; }
  .hero h1{font-size:34px;line-height:1.15;margin-bottom:10px;font-weight:800}
  .hero p{color:var(--muted);font-size:15px}

  .btn-admin {
    position: absolute; top: 0; right: 0; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; background: var(--card);
  }
  .btn-admin:hover { color: var(--gold); border-color: var(--gold); }

  .athlete-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.athlete-grid{grid-template-columns:1fr}}

  .athlete-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:.18s}
  .athlete-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 12px 30px -12px #000}
  .athlete-card:hover .arrow{color:var(--gold);transform:translateX(4px)}
  .avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    font-weight:800;font-size:17px;color:#0a1018;
    background:linear-gradient(135deg,var(--gold),#ffdf6b);letter-spacing:.5px}
  .athlete-info{flex:1;min-width:0}
  .athlete-name{font-weight:700;font-size:16px}
  .arrow{margin-left:auto;color:var(--muted);font-size:20px;transition:.18s}

  /* ---------- PAINEL ATLETA ---------- */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .back{width:42px;height:42px;border-radius:12px;background:var(--card);
    border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--muted); flex-shrink:0;}
  .back:hover{color:var(--gold);border-color:var(--gold)}
  .mini-logo{height:46px; width:auto; margin-left: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); display: none;}
  .mini-logo.loaded { display: block; }
  .id-block{display:flex;align-items:center;gap:12px; margin-left: auto;}
  .id-block .avatar{width:46px;height:46px;font-size:15px}
  .id-block h2{font-size:19px}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:32px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .stat b{display:block;font-size:26px;line-height:1}
  .stat small{color:var(--muted);font-size:12px;display:block;margin-top:6px}
  .val-purple{color:var(--purple)}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--muted);margin:0 0 14px 2px;font-weight:700; display: flex; justify-content: space-between; align-items: center;}

  /* ---------- DRILLS ---------- */
  .drills-grid { display: grid; gap: 12px; margin-bottom: 30px; }
  @media(min-width: 600px) { .drills-grid { grid-template-columns: 1fr 1fr; } }
  .drill-card { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; transition: .18s; text-align: left;}
  .drill-card:hover { border-color: var(--gold); background: #1a2739; }
  .drill-icon { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; font-size: 20px;}
  .drill-icon.yt { background: #ef444422; color: #ff4444; border: 1px solid #ef444444; }
  .drill-icon.ig { background: #a855f722; color: #d946ef; border: 1px solid #a855f744; }
  .drill-info { flex: 1; min-width: 0; }
  .drill-title { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drill-type { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .drill-play { width: 32px; height: 32px; border-radius: 50%; background: var(--line); display: grid; place-items: center; flex-shrink: 0; transition: .15s;}
  .drill-card:hover .drill-play { background: var(--gold); color: #000; }

  /* ---------- FEEDBACKS ---------- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{padding:8px 16px;border-radius:999px;font-size:13px;border:1px solid var(--line); color:var(--muted);background:var(--card);transition:.15s}
  .chip.active{background:var(--gold);color:#0a1018;border-color:var(--gold);font-weight:700}

  .fb-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold); border-radius:14px;padding:18px;margin-bottom:14px}
  .fb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
  .badge{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.3px}
  .fb-date{font-size:12px;color:var(--muted);white-space:nowrap}
  .fb-title{font-size:15.5px;margin-bottom:7px}
  .fb-text{font-size:14px;color:#c2cede;line-height:1.55;margin-bottom:12px}
  .fb-coach{font-size:12.5px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:20px;font-size:14px;border:1px dashed var(--line);border-radius:14px;margin-bottom:30px;}

  /* ---------- ADMIN ---------- */
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .admin-header h1 { font-size: 24px; color: var(--gold); }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 10px; flex-wrap: wrap;}
  .tab { padding: 10px 20px; border-radius: 8px; font-weight: 600; color: var(--muted); background: var(--card); border: 1px solid var(--line); }
  .tab.active { background: var(--gold); color: #0a1018; border-color: var(--gold); }
  .admin-form { background: var(--card); padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 24px; }
  .admin-form h3 { margin-bottom: 16px; font-size: 16px; color: #fff; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
  .btn-primary { width: 100%; padding: 14px; border-radius: 10px; background: var(--gold); color: #000; font-weight: 700; font-size: 15px; margin-top: 8px; transition: .2s;}
  .btn-primary:hover { filter: brightness(1.1); }
  
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); gap: 10px; }
  .list-item:last-child { border-bottom: none; }
  .list-item-info { flex: 1; min-width: 0; }
  .list-item-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .list-item-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
  .btn-delete { background: #ef444422; color: var(--red); border: 1px solid #ef444444; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }
  .btn-delete:hover { background: var(--red); color: #fff; }

  /* ---------- MODAL ---------- */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 1000; padding: 20px;}
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--card); border-radius: var(--radius); width: 100%; max-width: 800px; overflow: hidden; position: relative; transform: scale(0.95); transition: transform 0.2s; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);}
  .modal-overlay.active .modal-content { transform: scale(1); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--card2); border-bottom: 1px solid var(--line);}
  .modal-header h3 { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px;}
  .btn-close { font-size: 24px; line-height: 1; color: var(--muted); }
  .btn-close:hover { color: var(--red); }
  .video-container { position: relative; width: 100%; background: #000; }
  .video-container iframe { display: block; width: 100%; border: none; }
  .video-container.yt { aspect-ratio: 16 / 9; }
  .video-container.ig { aspect-ratio: 9 / 16; max-height: 80vh; margin: 0 auto; }
  .video-container.ig iframe { height: 100%; }
</style>
</head>
<body>

<div id="app"></div>

<!-- MODAL DE VÍDEO -->
<div class="modal-overlay" id="videoModal">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modalTitle">Vídeo</h3>
      <button class="btn-close" onclick="fecharVideo()">×</button>
    </div>
    <div class="video-container" id="videoContainer"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÕES INICIAIS
========================================================= */
const CATEGORIES = {
  positivo:    {label:'Ponto positivo',   color:'#22c55e'},
  construtivo: {label:'Ponto a melhorar', color:'#f5c518'},
  destaque:    {label:'Destaque',         color:'#a855f7'},
};

// LISTA DE ATLETAS BASEADA NAS IMAGENS ENVIADAS
const SEED_DATA = {
  atletas: [
    { id:'a1',  nome:'Pedro' },
    { id:'a2',  nome:'Davi Vidal' },
    { id:'a3',  nome:'Danilo Vidal' },
    { id:'a4',  nome:'Caio' },
    { id:'a5',  nome:'Pedro (Punk)' },
    { id:'a6',  nome:'Sombra' },
    { id:'a7',  nome:'João Pedro' },
    { id:'a8',  nome:'Davi Silva' },
    { id:'a9',  nome:'Francesco' },
    { id:'a10', nome:'David (Gelado)' },
    { id:'a11', nome:'MH' },
    { id:'a12', nome:'Alex (Soy Jo)' },
    { id:'a13', nome:'Arthur' },
    { id:'a14', nome:'Mussoi' },
    { id:'a15', nome:'Erick' },
    { id:'a16', nome:'Isaac' },
  ],
  // Deixei 2 exemplos de feedback e 2 de drills para você ver como funciona no painel
  feedbacks: [
    { id:'f1', atletaId:'a1', data:'2026-10-12', categoria:'destaque', treinador:'Coach Ricardo', titulo:'Leitura de zona impecável', texto:'Encontrou os receivers nos espaços da cobertura em zona e converteu três passes decisivos em 3º down.' },
    { id:'f2', atletaId:'a11', data:'2026-09-28', categoria:'construtivo', treinador:'Coach Ana', titulo:'Tempo de passe sob pressão', texto:'Em situações de blitz ficou segurando a bola além do necessário e sofreu sacks evitáveis.' }
  ],
  drills: [
    { id:'d1', atletaId:'a1', tipo:'youtube', titulo:'Drill: Leitura de Zona', url:'https://www.youtube.com/watch?v=dQw4w9WgXcQ' },
    { id:'d2', atletaId:'a11', tipo:'instagram', titulo:'Drill: Flag Pulling', url:'https://www.instagram.com/reel/C123456789/' }
  ]
};

/* =========================================================
   CARREGAMENTO SEGURO DO BANCO DE DADOS
========================================================= */
// Mudei a chave para 'imperadores_db_v2' para forçar a atualização dos nomes
const DB_KEY = 'imperadores_db_v2'; 

let DB = SEED_DATA;

try {
  const raw = localStorage.getItem(DB_KEY);
  if (raw) {
    const parsed = JSON.parse(raw);
    if (parsed && Array.isArray(parsed.atletas) && Array.isArray(parsed.feedbacks) && Array.isArray(parsed.drills)) {
      DB = parsed;
    } else {
      DB = JSON.parse(JSON.stringify(SEED_DATA));
      localStorage.setItem(DB_KEY, JSON.stringify(DB));
    }
  } else {
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  }
} catch (e) {
  DB = JSON.parse(JSON.stringify(SEED_DATA));
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}

function saveDB() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  } catch (e) {
    console.error('Erro ao salvar dados:', e);
  }
}

/* =========================================================
   HELPERS SEGUROS
========================================================= */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initials(nome) {
  if (!nome) return '?';
  // Remove os apelidos entre parênteses para pegar as iniciais certinho
  const nomeLimpo = nome.replace(/\(.*?\)/g, '').trim();
  return nomeLimpo.split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
}

function fmtDate(d) {
  if(!d) return '';
  const parts = d.split('-');
  if (parts.length !== 3) return d;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

/* =========================================================
   LÓGICA DO MODAL
========================================================= */
function abrirVideo(titulo, tipo, urlOriginal) {
  try {
    const container = document.getElementById('videoContainer');
    const modalTitle = document.getElementById('modalTitle');
    const modal = document.getElementById('videoModal');
    
    modalTitle.textContent = titulo || 'Vídeo';
    container.className = 'video-container ' + (tipo === 'youtube' ? 'yt' : 'ig');
    
    let embedUrl = '';
    if (tipo === 'youtube') {
      const match = urlOriginal.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([^&?]+)/);
      if (match && match[1]) embedUrl = `https://www.youtube.com/embed/${match[1]}?autoplay=1&rel=0`;
    } else if (tipo === 'instagram') {
      const match = urlOriginal.match(/instagram\.com\/(p|reel)\/([^/?]+)/);
      if (match && match[2]) embedUrl = `https://www.instagram.com/${match[1]}/${match[2]}/embed`;
    }
    
    if (embedUrl) {
      container.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    } else {
      alert('Link de vídeo inválido. Verifique a URL.');
    }
  } catch (e) {
    console.error(e);
    alert('Erro ao abrir o vídeo.');
  }
}

function fecharVideo() {
  const container = document.getElementById('videoContainer');
  const modal = document.getElementById('videoModal');
  if (modal) modal.classList.remove('active');
  document.body.style.overflow = '';
  setTimeout(() => { if(container) container.innerHTML = ''; }, 200);
}

document.getElementById('videoModal').addEventListener('click', function(e) {
  if (e.target === this) fecharVideo();
});

/* =========================================================
   ESTADO DA APLICAÇÃO
========================================================= */
let view = 'select';
let atletaAtualId = null;
let filtro = 'all';
let adminTab = 'feedbacks';
let isAdminAuth = false;

function selecionarAtleta(id){
  atletaAtualId = id; filtro = 'all'; view = 'panel';
  render(); window.scrollTo(0,0);
}

function voltar(){ 
  view = 'select'; atletaAtualId = null; 
  render(); window.scrollTo(0,0); 
}

function irParaAdmin(){
  if(!isAdminAuth){
    const pass = prompt('🔒 Área restrita. Digite a senha:');
    if(pass === 'admin') { isAdminAuth = true; }
    else if(pass !== null) { alert('Senha incorreta!'); return; }
    else { return; }
  }
  view = 'admin'; render(); window.scrollTo(0,0);
}

function sairAdmin(){ view = 'select'; render(); window.scrollTo(0,0); }
function setFiltro(f){ filtro = f; render(); }
function setAdminTab(tab){ adminTab = tab; render(); }

/* =========================================================
   AÇÕES DO ADMIN
========================================================= */
function addAtleta(e) {
  e.preventDefault();
  try {
    const nome = e.target.nome.value.trim();
    if(!nome) return;
    DB.atletas.push({ id: 'a'+Date.now(), nome });
    saveDB(); e.target.reset(); render();
    alert('Atleta cadastrado com sucesso!');
  } catch (err) {
    console.error(err);
    alert('Erro ao cadastrar atleta.');
  }
}

function addFeedback(e) {
  e.preventDefault();
  try {
    const fd = new FormData(e.target);
    const atletaId = fd.get('atletaId');
    if(!atletaId) { alert('Cadastre um atleta primeiro.'); return; }
    
    DB.feedbacks.push({
      id: 'f'+Date.now(),
      atletaId: atletaId,
      data: fd.get('data') || new Date().toISOString().slice(0,10),
      categoria: fd.get('categoria') || 'positivo',
      treinador: fd.get('treinador') || 'Treinador',
      titulo: fd.get('titulo') || 'Sem título',
      texto: fd.get('texto') || ''
    });
    saveDB(); e.target.reset(); render();
    alert('Feedback salvo com sucesso!');
  } catch (err) {
    console.error(err);
    alert('Erro ao salvar feedback.');
  }
}

function addDrill(e) {
  e.preventDefault();
  try {
    const fd = new FormData(e.target);
    const atletaId = fd.get('atletaId');
    if(!atletaId) { alert('Cadastre um atleta primeiro.'); return; }
    
    DB.drills.push({
      id: 'd'+Date.now(),
      atletaId: atletaId,
      tipo: fd.get('tipo') || 'youtube',
      titulo: fd.get('titulo') || 'Sem título',
      url: fd.get('url') || ''
    });
    saveDB(); e.target.reset(); render();
    alert('Drill salvo com sucesso!');
  } catch (err) {
    console.error(err);
    alert('Erro ao salvar drill.');
  }
}

function deleteItem(tipo, id) {
  if(!confirm('Tem certeza que deseja excluir?')) return;
  try {
    DB[tipo] = DB[tipo].filter(item => item.id !== id);
    if(tipo === 'atletas') {
      DB.feedbacks = DB.feedbacks.filter(f => f.atletaId !== id);
      DB.drills = DB.drills.filter(d => d.atletaId !== id);
    }
    saveDB(); render();
  } catch (err) {
    console.error(err);
    alert('Erro ao excluir item.');
  }
}

function resetarDados() {
  if(!confirm('Isso apagará TUDO e restaurará a lista de atletas original. Continuar?')) return;
  DB = JSON.parse(JSON.stringify(SEED_DATA));
  saveDB(); render();
  alert('Dados restaurados!');
}

/* =========================================================
   TELA: SELEÇÃO
========================================================= */
function viewSelect(){
  const cards = DB.atletas.length ? DB.atletas.map(a => `
    <button class="athlete-card" onclick="selecionarAtleta('${a.id}')">
      <div class="avatar">${initials(a.nome)}</div>
      <div class="athlete-info">
        <div class="athlete-name">${esc(a.nome)}</div>
      </div>
      <div class="arrow">→</div>
    </button>`).join('') : '<div class="empty">Nenhum atleta cadastrado. Acesse a Área do Treinador.</div>';

  return `
  <div class="wrap">
    <header class="hero">
      <button class="btn-admin" onclick="irParaAdmin()">⚙️ Área do Treinador</button>
      <img src="logo.png" alt="Imperadores" class="brand-logo" onload="this.classList.add('loaded')">
      <h1>Quem está acessando?</h1>
      <p>Selecione seu nome para abrir o seu painel.</p>
    </header>
    <div class="athlete-grid">${cards}</div>
  </div>`;
}

/* =========================================================
   TELA: PAINEL DO ATLETA
========================================================= */
function viewPanel(){
  const a = DB.atletas.find(x => x.id === atletaAtualId);
  if(!a){ view = 'select'; return viewSelect(); }

  const todos = DB.feedbacks.filter(f => f.atletaId === a.id).sort((x,y) => (y.data || '').localeCompare(x.data || ''));
  const destaques = todos.filter(f => f.categoria === 'destaque').length;
  const filtrados = filtro === 'all' ? todos : todos.filter(f => f.categoria === filtro);
  const meusDrills = DB.drills.filter(d => d.atletaId === a.id);

  const drillsHtml = meusDrills.length ? `
    <h3 class="section-title">Drills / Treinos em Vídeo</h3>
    <div class="drills-grid">
      ${meusDrills.map(d => {
        const isYt = d.tipo === 'youtube';
        return `
          <button class="drill-card" onclick="abrirVideo('${esc(d.titulo).replace(/'/g, "\\'")}', '${d.tipo}', '${esc(d.url).replace(/'/g, "\\'")}')">
            <div class="drill-icon ${isYt ? 'yt' : 'ig'}">${isYt ? '▶' : '◎'}</div>
            <div class="drill-info">
              <div class="drill-title">${esc(d.titulo)}</div>
              <div class="drill-type">${isYt ? 'YouTube' : 'Instagram'}</div>
            </div>
            <div class="drill-play"><svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor"><path d="M0 0L12 7L0 14V0Z"/></svg></div>
          </button>`;
      }).join('')}
    </div>
  ` : '';

  const listaHtml = filtrados.length ? filtrados.map(f => {
    const cat = CATEGORIES[f.categoria] || CATEGORIES.positivo;
    return `
    <article class="fb-card" style="border-left-color:${cat.color}">
      <div class="fb-head">
        <span class="badge" style="background:${cat.color}22;color:${cat.color};border:1px solid ${cat.color}55">${cat.label}</span>
        <span class="fb-date">${fmtDate(f.data)}</span>
      </div>
      <h3 class="fb-title">${esc(f.titulo)}</h3>
      <p class="fb-text">${esc(f.texto)}</p>
      <div class="fb-coach">👤 ${esc(f.treinador)}</div>
    </article>`;
  }).join('') : `<div class="empty">Nenhum feedback nesta categoria ainda.</div>`;

  const chips = [
    {id:'all', label:'Todos'}, {id:'positivo', label:'Positivos'},
    {id:'construtivo', label:'A melhorar'}, {id:'destaque', label:'Destaques'},
  ].map(c => `<button class="chip ${filtro===c.id?'active':''}" onclick="setFiltro('${c.id}')">${c.label}</button>`).join('');

  return `
  <div class="wrap">
    <div class="topbar">
      <button class="back" onclick="voltar()">←</button>
      <img src="logo.png" alt="Imperadores" class="mini-logo" onload="this.classList.add('loaded')">
      <div class="id-block">
        <div class="avatar">${initials(a.nome)}</div>
        <div><h2>${esc(a.nome)}</h2></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><b>${todos.length}</b><small>Feedbacks Recebidos</small></div>
      <div class="stat"><b class="val-purple">${destaques}</b><small>Destaques</small></div>
    </div>

    ${drillsHtml}

    <h3 class="section-title">Histórico de feedbacks</h3>
    <div class="chips">${chips}</div>
    ${listaHtml}
  </div>`;
}

/* =========================================================
   TELA: ADMIN
========================================================= */
function viewAdmin(){
  const atletaOptions = DB.atletas.length 
    ? DB.atletas.map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('')
    : '<option value="">Nenhum atleta cadastrado</option>';

  const hoje = new Date().toISOString().slice(0,10);
  let content = '';

  if(adminTab === 'feedbacks') {
    const lista = DB.feedbacks.slice().sort((a,b) => (b.data || '').localeCompare(a.data || '')).map(f => {
      const atleta = DB.atletas.find(a => a.id === f.atletaId);
      return `
        <div class="list-item">
          <div class="list-item-info">
            <div class="list-item-title">${esc(f.titulo)} <span style="color:var(--muted);font-weight:400">- ${esc(atleta ? atleta.nome : 'Excluído')}</span></div>
            <div class="list-item-sub">${fmtDate(f.data)} · ${(CATEGORIES[f.categoria] || CATEGORIES.positivo).label}</div>
          </div>
          <button class="btn-delete" onclick="deleteItem('feedbacks', '${f.id}')">Excluir</button>
        </div>`;
    }).join('') || '<div class="empty">Nenhum feedback cadastrado.</div>';

    content = `
      <div class="admin-form">
        <h3>➕ Novo Feedback</h3>
        <form onsubmit="addFeedback(event)">
          <div class="form-row">
            <select name="atletaId" required>${atletaOptions}</select>
            <input type="date" name="data" value="${hoje}" required>
          </div>
          <div class="form-row">
            <select name="categoria">
              <option value="positivo">Ponto Positivo</option>
              <option value="construtivo">Ponto a Melhorar</option>
              <option value="destaque">Destaque</option>
            </select>
            <input name="treinador" placeholder="Nome do Treinador" required>
          </div>
          <input name="titulo" placeholder="Título do Feedback" required>
          <textarea name="texto" placeholder="Descrição detalhada..." rows="3" required></textarea>
          <button type="submit" class="btn-primary">Salvar Feedback</button>
        </form>
      </div>
      <div class="admin-form">
        <h3>📋 Feedbacks Cadastrados (${DB.feedbacks.length})</h3>
        ${lista}
      </div>`;
  } 
  else if(adminTab === 'drills') {
    const lista = DB.drills.map(d => {
      const atleta = DB.atletas.find(a => a.id === d.atletaId);
      return `
        <div class="list-item">
          <div class="list-item-info">
            <div class="list-item-title">${esc(d.titulo)} <span style="color:var(--muted);font-weight:400">- ${esc(atleta ? atleta.nome : 'Excluído')}</span></div>
            <div class="list-item-sub">${(d.tipo || '').toUpperCase()} · ${esc(d.url)}</div>
          </div>
          <button class="btn-delete" onclick="deleteItem('drills', '${d.id}')">Excluir</button>
        </div>`;
    }).join('') || '<div class="empty">Nenhum drill cadastrado.</div>';

    content = `
      <div class="admin-form">
        <h3>➕ Novo Drill em Vídeo</h3>
        <form onsubmit="addDrill(event)">
          <div class="form-row">
            <select name="atletaId" required>${atletaOptions}</select>
            <select name="tipo">
              <option value="youtube">YouTube</option>
              <option value="instagram">Instagram (Reels/Post)</option>
            </select>
          </div>
          <input name="titulo" placeholder="Título do Drill (Ex: Treino de Footwork)" required>
          <input name="url" placeholder="Cole o link do vídeo (YouTube ou Instagram)" required>
          <button type="submit" class="btn-primary">Salvar Drill</button>
        </form>
      </div>
      <div class="admin-form">
        <h3>📋 Drills Cadastrados (${DB.drills.length})</h3>
        ${lista}
      </div>`;
  }
  else if(adminTab === 'atletas') {
    const lista = DB.atletas.map(a => `
      <div class="list-item">
        <div class="list-item-info">
          <div class="list-item-title">${esc(a.nome)}</div>
          <div class="list-item-sub">${initials(a.nome)}</div>
        </div>
        <button class="btn-delete" onclick="deleteItem('atletas', '${a.id}')">Excluir</button>
      </div>`).join('') || '<div class="empty">Nenhum atleta cadastrado.</div>';

    content = `
      <div class="admin-form">
        <h3>➕ Novo Atleta</h3>
        <form onsubmit="addAtleta(event)">
          <input name="nome" placeholder="Nome completo do atleta" required>
          <button type="submit" class="btn-primary">Cadastrar Atleta</button>
        </form>
      </div>
      <div class="admin-form">
        <h3>👥 Atletas Cadastrados (${DB.atletas.length})</h3>
        ${lista}
      </div>
      <div class="admin-form" style="border-color: var(--red);">
        <h3 style="color: var(--red);">⚠️ Zona de Perigo</h3>
        <p style="color: var(--muted); font-size: 13px; margin-bottom: 12px;">Restaura os dados de exemplo e apaga tudo o que foi cadastrado.</p>
        <button class="btn-primary" style="background: var(--red); color: #fff;" onclick="resetarDados()">Restaurar Dados de Exemplo</button>
      </div>`;
  }

  return `
  <div class="wrap">
    <div class="admin-header">
      <h1>⚙️ Painel do Treinador</h1>
      <button class="back" onclick="sairAdmin()" title="Sair">✕</button>
    </div>
    
    <div class="tabs">
      <button class="tab ${adminTab==='feedbacks'?'active':''}" onclick="setAdminTab('feedbacks')">Feedbacks</button>
      <button class="tab ${adminTab==='drills'?'active':''}" onclick="setAdminTab('drills')">Drills</button>
      <button class="tab ${adminTab==='atletas'?'active':''}" onclick="setAdminTab('atletas')">Atletas</button>
    </div>

    ${content}
  </div>`;
}

/* =========================================================
   RENDER PRINCIPAL
========================================================= */
function render(){
  try {
    const app = document.getElementById('app');
    if(view === 'select') app.innerHTML = viewSelect();
    else if(view === 'panel') app.innerHTML = viewPanel();
    else if(view === 'admin') app.innerHTML = viewAdmin();
  } catch (e) {
    console.error('Erro no render:', e);
    document.getElementById('app').innerHTML = `
      <div class="wrap" style="text-align:center;padding:40px 20px;">
        <h2 style="color:var(--red);margin-bottom:12px;">Ops! Algo deu errado.</h2>
        <p style="color:var(--muted);margin-bottom:20px;">Tente recarregar a página. Se persistir, restaure os dados.</p>
        <button class="btn-primary" style="max-width:300px;margin:0 auto;" onclick="resetarDados(); location.reload();">Restaurar e Recarregar</button>
      </div>`;
  }
}

// Inicia
render();
</script>
</body>
</html>
