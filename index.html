<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Imperadores · Sistema de Feedbacks</title>
<style>
  :root{
    --bg:#0a1018; --card:#151f2e; --card2:#1b2738; --card-hover:#1a2739; --line:#24334a;
    --text:#e9f0fa; --text-soft:#c2cede; --muted:#8798b0;
    --gold:#f5c518; --gold-light:#ffdf6b; --green:#22c55e; --purple:#a855f7; --red:#ef4444;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#132033 0%,var(--bg) 55%) var(--bg);
    color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
    padding:24px 16px 60px;
  }
  body:has(dialog[open]){overflow:hidden}
  .wrap{max-width:880px;margin:0 auto}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .empty{text-align:center;color:var(--muted);padding:20px;font-size:14px;line-height:1.5;border:1px dashed var(--line);border-radius:14px;margin-bottom:30px}
  .btn-primary{width:100%;padding:14px;border-radius:10px;background:var(--gold);color:#000;font-weight:700;font-size:15px;margin-top:8px;transition:.2s}
  .btn-primary:hover{filter:brightness(1.1)}

  /* Selo "Novo" (itens que o atleta ainda não viu neste aparelho) */
  .selo-novo{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;background:var(--gold);color:var(--bg);flex-shrink:0;line-height:1.3}

  /* Logo: só aparece depois de carregar (classe .logo-ok no body) */
  .logo{display:none}
  .logo-ok .logo{display:block}

  /* ---------- SELEÇÃO ---------- */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin:24px 0 36px}
  .brand-logo{max-width:180px;width:100%;height:auto;margin-bottom:24px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
  .hero h1{font-size:34px;line-height:1.15;margin-bottom:10px;font-weight:800}
  .hero p{color:var(--muted);font-size:15px}

  .athlete-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .athlete-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:.18s}
  .athlete-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 12px 30px -12px #000}
  .athlete-card:hover .arrow{color:var(--gold);transform:translateX(4px)}
  .athlete-card.tem-novo{border-color:#f5c51866}
  .avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    font-weight:800;font-size:17px;color:var(--bg);letter-spacing:.5px;
    background:linear-gradient(135deg,var(--gold),var(--gold-light))}
  .athlete-info{flex:1;min-width:0}
  .athlete-name{font-weight:700;font-size:16px}
  .arrow{color:var(--muted);font-size:20px;transition:.18s}

  .skeleton{height:86px;border-radius:var(--radius);border:1px solid var(--line);
    background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;
    animation:brilho 1.2s linear infinite}
  @keyframes brilho{to{background-position:-200% 0}}

  /* ---------- PAINEL DO ATLETA ---------- */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .back{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    display:grid;place-items:center;font-size:18px;color:var(--muted);flex-shrink:0}
  .back:hover{color:var(--gold);border-color:var(--gold)}
  .mini-logo{height:46px;width:auto;margin-left:10px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .id-block{display:flex;align-items:center;gap:12px;margin-left:auto;min-width:0}
  .id-block .avatar{width:46px;height:46px;font-size:15px}
  .id-text{min-width:0}
  .id-text h2{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .id-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:0 0 14px 2px;font-weight:700}

  /* ---------- DRILLS ---------- */
  .drills-grid{display:grid;gap:12px;margin-bottom:32px}
  .drill-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px 14px 10px 10px;transition:.18s;text-align:left}
  .drill-card:hover{border-color:var(--gold);background:var(--card-hover)}
  .drill-thumb{position:relative;width:112px;aspect-ratio:16/9;border-radius:10px;flex-shrink:0;overflow:hidden;
    display:grid;place-items:center;background:var(--card2) center/cover no-repeat;border:1px solid var(--line)}
  .drill-thumb.ig{background-image:linear-gradient(135deg,#7c3aed,#db2777 55%,#f59e0b);border:none}
  .drill-thumb.invalido{color:var(--muted);font-size:20px}
  .drill-thumb .play{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:rgba(0,0,0,.6);color:#fff;transition:.15s}
  .drill-card:hover .drill-thumb .play{background:var(--gold);color:#000}
  .drill-info{flex:1;min-width:0}
  .drill-title{font-size:14.5px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .drill-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .drill-type{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  /* ---------- FEEDBACKS ---------- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{padding:8px 14px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--muted);background:var(--card);transition:.15s}
  .chip-n{margin-left:6px;font-weight:700;opacity:.75}
  .chip.zero{opacity:.5}
  .chip.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;opacity:1}

  .fb-card{--cat:var(--gold);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cat);border-radius:14px;padding:18px;margin-bottom:14px}
  .fb-card.destacado{padding:22px;margin-bottom:32px;border-color:color-mix(in srgb,var(--cat) 45%,var(--line));border-left-color:var(--cat);
    background:linear-gradient(180deg,color-mix(in srgb,var(--cat) 9%,var(--card)),var(--card));box-shadow:0 18px 40px -24px #000}
  .fb-card.destacado .fb-title{font-size:18px}
  .fb-card.destacado .fb-text{font-size:15px}
  .fb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
  .fb-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.3px;color:var(--cat);
    background:color-mix(in srgb,var(--cat) 13%,transparent);border:1px solid color-mix(in srgb,var(--cat) 33%,transparent)}
  .fb-date{font-size:12px;color:var(--muted);white-space:nowrap}
  .fb-title{font-size:15.5px;margin-bottom:7px}
  .fb-text{font-size:14px;color:var(--text-soft);line-height:1.55;margin-bottom:12px;white-space:pre-line}
  .fb-coach{font-size:12.5px;color:var(--muted)}

  /* ---------- AVISOS E ESTADOS (carregando / erro / configuração) ---------- */
  .aviso{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;
    background:#f5c51814;border:1px solid #f5c51855;color:var(--text-soft);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px}
  .aviso button{color:var(--gold);font-weight:700;font-size:13px}
  .estado{text-align:center;padding:48px 20px;max-width:540px}
  .estado h2{margin-bottom:12px}
  .estado.erro h2{color:var(--red)}
  .estado p{color:var(--muted);margin-bottom:20px;line-height:1.6}
  .estado code{background:var(--card2);border:1px solid var(--line);padding:2px 6px;border-radius:6px;color:var(--gold);font-size:13px}
  .estado .btn-primary{max-width:300px}

  /* ---------- MODAL DE VÍDEO (<dialog> nativo: Esc e foco já vêm prontos) ---------- */
  .modal{width:800px;max-width:calc(100% - 40px);max-height:calc(100vh - 40px);margin:auto;padding:0;border:none;
    border-radius:var(--radius);overflow:hidden;background:var(--card);color:var(--text);box-shadow:0 25px 50px -12px rgba(0,0,0,.8)}
  .modal[open]{animation:pop .2s ease}
  .modal::backdrop{background:rgba(0,0,0,.85);backdrop-filter:blur(4px)}
  .modal.ig{width:440px}
  @keyframes pop{from{opacity:0;transform:scale(.95)}}
  .modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--card2);border-bottom:1px solid var(--line)}
  .modal-header h3{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
  .btn-close{font-size:24px;line-height:1;color:var(--muted)}
  .btn-close:hover{color:var(--red)}
  .video-container{position:relative;width:100%;background:#000}
  .video-container iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video-container.yt{aspect-ratio:16/9}
  .video-container.ig{aspect-ratio:9/16;width:min(100%,40vh);margin:0 auto}
  .modal-footer{display:flex;justify-content:center;padding:12px 18px;background:var(--card2);border-top:1px solid var(--line)}
  .btn-externo{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-weight:600;font-size:14px;text-decoration:none;transition:.15s}
  .btn-externo:hover{border-color:var(--gold);color:var(--gold)}

  /* ---------- TOASTS ---------- */
  .toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2000;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
  .toast{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--green);color:var(--text);padding:12px 16px;border-radius:10px;font-size:14px;
    box-shadow:0 12px 30px -10px #000;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:none}
  .toast.erro{border-left-color:var(--red)}

  /* ---------- RESPONSIVO ---------- */
  @media(min-width:600px){ .drills-grid{grid-template-columns:1fr 1fr} }
  @media(max-width:600px){ .athlete-grid{grid-template-columns:1fr} }
  @media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div id="app"></div>

<dialog class="modal" id="videoModal" aria-labelledby="modalTitle">
  <div class="modal-header">
    <h3 id="modalTitle">Vídeo</h3>
    <button class="btn-close" data-action="fecharVideo" aria-label="Fechar vídeo">×</button>
  </div>
  <div class="video-container" id="videoContainer"></div>
  <div class="modal-footer">
    <a class="btn-externo" id="modalLink" target="_blank" rel="noopener noreferrer">Abrir no YouTube ↗</a>
  </div>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
'use strict';

/* =========================================================
   CONFIGURAÇÃO
   👉 Cole abaixo o link da planilha do Google (o da barra de endereço).
      A planilha precisa estar compartilhada como "Qualquer pessoa com o link: Leitor".
      Passo a passo completo no README.md.
========================================================= */
const PLANILHA = 'https://docs.google.com/spreadsheets/d/1BVPQc2Wnff3fRlhoLgMas6Egvwe2Ibr9EvJarrZaEWQ/edit';

const ABAS = { atletas: 'Atletas', feedbacks: 'Feedbacks', drills: 'Drills' };
const LOGO_SRC   = 'logo.png';
const CACHE_KEY  = 'imperadores_cache_v2';
const VISTOS_KEY = 'imperadores_vistos_v1';

const CATEGORIAS = {
  positivo:    { label: 'Ponto positivo',   filtro: 'Positivos',  cor: '#22c55e' },
  construtivo: { label: 'Ponto a melhorar', filtro: 'A melhorar', cor: '#f5c518' },
  destaque:    { label: 'Destaque',         filtro: 'Destaques',  cor: '#a855f7' },
};

const FILTROS = [
  { id: 'all', label: 'Todos' },
  ...Object.entries(CATEGORIAS).map(([id, c]) => ({ id, label: c.filtro })),
];

/* =========================================================
   UTILITÁRIOS
========================================================= */
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);

// "  João  Pedro " → "joao pedro" (para comparar nomes sem ligar para acento/maiúscula)
const normalizar = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/\s+/g, ' ').trim();

const pad2 = n => String(n).padStart(2, '0');
const plural = (n, palavra) => `${n} ${palavra}${n === 1 ? '' : 's'}`;

// Hash curto e estável (FNV-1a) para identificar cada feedback/drill sem precisar de coluna de ID
function hash(texto) {
  let h = 2166136261;
  for (let i = 0; i < texto.length; i++) {
    h ^= texto.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}

function iniciais(nome) {
  const texto = String(nome ?? '');
  // Ignora apelidos entre parênteses — a não ser que o nome seja só o apelido
  const base = texto.replace(/\(.*?\)/g, '').trim() || texto.replace(/[()]/g, '');
  return base.trim().split(/\s+/).filter(Boolean).slice(0, 2)
    .map(p => Array.from(p)[0]).join('').toUpperCase() || '?';
}

// Aceita "2026-10-12", "12/10/2026" ou "12/10/26". Retorna "AAAA-MM-DD" ou '' se não reconhecer.
function paraISO(valor) {
  const s = String(valor ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})\b/);
  if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  return '';
}

function fmtData(iso) {
  const [a, m, d] = String(iso ?? '').split('-');
  return d ? `${d}/${m}/${a}` : '';
}

function idCategoria(valor) {
  const v = normalizar(valor);
  if (v.includes('destaque')) return 'destaque';
  if (v.includes('melhorar') || v.includes('construtivo')) return 'construtivo';
  return 'positivo';
}

const porDataDesc = (a, b) => (b.data || '').localeCompare(a.data || '');

/**
 * Reconhece links do YouTube/Instagram. Retorna null se o link for inválido, ou:
 * { tipo, embed (player), link (endereço "limpo" para abrir no app), thumb (miniatura, só YouTube) }
 */
function parseVideo(url) {
  const u = String(url ?? '').trim();

  const yt = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/|live\/))([\w-]{11})/);
  if (yt) {
    const id = yt[1];
    return {
      tipo:  'youtube',
      embed: `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`,
      link:  `https://www.youtube.com/watch?v=${id}`,
      thumb: `https://i.ytimg.com/vi/${id}/mqdefault.jpg`,
    };
  }

  const ig = u.match(/instagram\.com\/(?:[\w.]+\/)?(p|reels?|tv)\/([\w-]+)/);
  if (ig) {
    const base = `https://www.instagram.com/${ig[1].startsWith('reel') ? 'reel' : 'p'}/${ig[2]}/`;
    return { tipo: 'instagram', embed: base + 'embed', link: base, thumb: '' };
  }
  return null;
}

function toast(msg, tipo = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${tipo}`;
  el.textContent = msg;
  document.getElementById('toasts').append(el);
  el.offsetWidth; // força o reflow para a transição de entrada acontecer
  el.classList.add('show');
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, 2600);
}

/* =========================================================
   LEITURA DA PLANILHA DO GOOGLE
========================================================= */
class ErroPlanilha extends Error {}

const CONFIG = (() => {
  const v = PLANILHA.trim();
  if (!v || v.startsWith('COLE_')) {
    return { erro: 'Abra o arquivo <code>index.html</code> e cole o link da planilha do Google na linha <code>const PLANILHA</code>.' };
  }
  if (/\/d\/e\//.test(v)) {
    return { erro: 'O link em <code>PLANILHA</code> é o de "Publicar na Web". Use o link normal, o que aparece na barra de endereço com a planilha aberta.' };
  }
  const id = v.match(/\/d\/([\w-]+)/)?.[1] || v;
  return /^[\w-]{20,}$/.test(id) ? { id } : { erro: 'O link em <code>PLANILHA</code> não parece ser de uma planilha do Google.' };
})();

// Nomes de coluna aceitos (já normalizados) → nome usado no código
const COLUNAS = {
  nome: 'nome', atleta: 'atleta', data: 'data', categoria: 'categoria', tipo: 'categoria',
  treinador: 'treinador', coach: 'treinador', titulo: 'titulo',
  texto: 'texto', descricao: 'texto', feedback: 'texto',
  link: 'link', url: 'link', video: 'link',
};

// Datas chegam como "Date(2026,9,12)" (mês começa em 0)
function valorCelula(celula) {
  if (!celula || celula.v == null) return '';
  if (typeof celula.v === 'string') {
    const d = celula.v.match(/^Date\((\d+),(\d+),(\d+)/);
    return d ? `${d[1]}-${pad2(+d[2] + 1)}-${pad2(d[3])}` : celula.v.trim();
  }
  return String(celula.f ?? celula.v).trim();
}

async function lerAba(aba, obrigatorias) {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.id}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(aba)}`;
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) {
    throw new ErroPlanilha(resp.status === 404
      ? 'Planilha não encontrada. Confira o link colocado em PLANILHA.'
      : `A planilha respondeu com erro ${resp.status}.`);
  }

  let json;
  try {
    const texto = await resp.text();
    json = JSON.parse(texto.slice(texto.indexOf('{'), texto.lastIndexOf('}') + 1));
  } catch {
    throw new ErroPlanilha('A planilha não está pública. Compartilhe como "Qualquer pessoa com o link: Leitor".');
  }
  if (json.status === 'error') {
    throw new ErroPlanilha(`Erro ao ler a aba "${aba}": ${json.errors?.[0]?.detailed_message || 'erro desconhecido'}.`);
  }

  // Se a aba não existir, o Google devolve a primeira aba — por isso conferimos as colunas
  const colunas = json.table.cols.map(c => COLUNAS[normalizar(c.label)] || '');
  const faltando = obrigatorias.filter(c => !colunas.includes(c));
  if (faltando.length) {
    throw new ErroPlanilha(`Não encontrei a aba "${aba}" com a(s) coluna(s): ${faltando.join(', ')}.`);
  }

  return json.table.rows.map(linha => {
    const obj = {};
    colunas.forEach((col, i) => { if (col) obj[col] = valorCelula(linha.c[i]); });
    return obj;
  });
}

async function buscarPlanilha() {
  const [atletas, feedbacks, drills] = await Promise.all([
    lerAba(ABAS.atletas,   ['nome']),
    lerAba(ABAS.feedbacks, ['atleta', 'titulo']),
    lerAba(ABAS.drills,    ['atleta', 'link']),
  ]);

  const vistos = new Set();
  return {
    atletas: atletas
      .filter(a => a.nome)
      .map(a => ({ id: normalizar(a.nome), nome: a.nome }))
      .filter(a => !vistos.has(a.id) && vistos.add(a.id)),

    feedbacks: feedbacks
      .filter(f => f.atleta && (f.titulo || f.texto))
      .map(f => {
        const atletaId = normalizar(f.atleta);
        return {
          id:        'f' + hash([atletaId, f.data, f.titulo, f.texto].join('|')),
          atletaId,
          data:      paraISO(f.data),
          dataTexto: f.data || '',
          categoria: idCategoria(f.categoria),
          treinador: f.treinador || '',
          titulo:    f.titulo || '',
          texto:     f.texto || '',
        };
      })
      .reverse(), // linhas mais de baixo (mais novas) primeiro quando a data empata

    drills: drills
      .filter(d => d.atleta && d.link)
      .map(d => {
        const atletaId = normalizar(d.atleta); // "Todos" = aparece para o time inteiro
        const video = parseVideo(d.link);
        return {
          id:     'd' + hash([atletaId, d.link, d.titulo].join('|')),
          atletaId,
          titulo: d.titulo || 'Drill',
          url:    d.link,
          tipo:   video?.tipo || '',
          thumb:  video?.thumb || '',
        };
      }),
  };
}

/* ---------- Cópia local: abre rápido e funciona sem internet ---------- */
function lerCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    return c && c.planilha === CONFIG.id && Array.isArray(c.dados?.atletas) ? c.dados : null;
  } catch {
    return null;
  }
}

function salvarCache(dados) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ planilha: CONFIG.id, dados })); } catch { /* sem espaço/bloqueado: tudo bem */ }
}

/* ---------- O que cada atleta já viu neste aparelho (para o selo "Novo") ---------- */
function lerVistos() {
  try {
    const v = JSON.parse(localStorage.getItem(VISTOS_KEY));
    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  } catch {
    return {};
  }
}

function marcarVistos(atletaId, ids) {
  const vistos = lerVistos();
  vistos[atletaId] = ids;
  try { localStorage.setItem(VISTOS_KEY, JSON.stringify(vistos)); } catch { /* sem problema */ }
}

/* =========================================================
   ESTADO
========================================================= */
let DB = { atletas: [], feedbacks: [], drills: [] };

const state = {
  status: 'carregando',  // 'carregando' | 'ok' | 'erro' | 'config'
  erro: '',
  desatualizado: false,  // true = mostrando a cópia local porque a planilha não respondeu
  view: 'select',        // 'select' | 'panel'
  atletaId: null,
  filtro: 'all',
  vistosAoAbrir: null,   // Set com o que o atleta já tinha visto quando abriu o painel
};

function atualizar(patch) {
  Object.assign(state, patch);
  render();
}

function navegar(patch) {
  atualizar(patch);
  window.scrollTo(0, 0);
}

function itensDoAtleta(atletaId) {
  return {
    feedbacks: DB.feedbacks.filter(f => f.atletaId === atletaId).sort(porDataDesc),
    drills:    DB.drills.filter(d => d.atletaId === atletaId || d.atletaId === 'todos'),
  };
}

const idsDe = ({ feedbacks, drills }) => [...feedbacks, ...drills].map(item => item.id);

// Quantos itens o atleta ainda não viu. Sem registro neste aparelho = 0 (não sabemos quem é).
function contarNovos(atletaId, vistos) {
  if (!Array.isArray(vistos[atletaId])) return 0;
  const jaViu = new Set(vistos[atletaId]);
  return idsDe(itensDoAtleta(atletaId)).filter(id => !jaViu.has(id)).length;
}

function abrirPainel(id) {
  const registro = lerVistos()[id];
  // null = primeira vez deste atleta neste aparelho: nada aparece como "Novo"
  state.vistosAoAbrir = Array.isArray(registro) ? new Set(registro) : null;
  navegar({ view: 'panel', atletaId: id, filtro: 'all' });
}

let ultimaBusca = 0;

async function buscarEAtualizar() {
  ultimaBusca = Date.now();
  try {
    const novo = await buscarPlanilha();
    const mudou = JSON.stringify(novo) !== JSON.stringify(DB);
    DB = novo;
    salvarCache(novo);
    if (mudou || state.status !== 'ok' || state.desatualizado) {
      atualizar({ status: 'ok', erro: '', desatualizado: false });
    }
  } catch (e) {
    console.error('Erro ao ler a planilha:', e);
    const erro = e instanceof ErroPlanilha
      ? e.message
      : 'Confira sua internet e se a planilha está compartilhada como "Qualquer pessoa com o link".';
    if (state.status === 'ok') atualizar({ desatualizado: true, erro });
    else atualizar({ status: 'erro', erro });
  }
}

/* =========================================================
   MODAL DE VÍDEO
========================================================= */
const modal       = document.getElementById('videoModal');
const modalTitulo = document.getElementById('modalTitle');
const modalLink   = document.getElementById('modalLink');
const videoBox    = document.getElementById('videoContainer');

function abrirVideo(drill) {
  const video = drill && parseVideo(drill.url);
  if (!video) return toast('Link de vídeo inválido. Avise o treinador.', 'erro');

  const ig = video.tipo === 'instagram';
  modal.classList.toggle('ig', ig);
  videoBox.className = `video-container ${ig ? 'ig' : 'yt'}`;
  modalTitulo.textContent = drill.titulo || 'Vídeo';

  // Link reconstruído a partir do ID do vídeo (nunca o texto cru da planilha)
  modalLink.href = video.link;
  modalLink.textContent = `Abrir no ${ig ? 'Instagram' : 'YouTube'} ↗`;

  const iframe = document.createElement('iframe');
  iframe.src = video.embed;
  iframe.title = drill.titulo || 'Vídeo';
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  iframe.allowFullscreen = true;
  videoBox.replaceChildren(iframe);

  modal.showModal();
}

// Ao fechar (botão, Esc ou clique fora) remove o iframe para o vídeo parar
modal.addEventListener('close', () => videoBox.replaceChildren());

/* =========================================================
   COMPONENTES
========================================================= */
const logo     = classe => `<img src="${LOGO_SRC}" alt="Imperadores" class="logo ${classe}">`;
const avatar   = nome => `<div class="avatar" aria-hidden="true">${esc(iniciais(nome))}</div>`;
const vazio    = msg => `<div class="empty">${msg}</div>`;
const seloNovo = '<span class="selo-novo">Novo</span>';

const avisoDesatualizado = () => state.desatualizado ? `
  <div class="aviso" role="status">
    <span>⚠️ Não foi possível atualizar. Mostrando os últimos dados carregados.</span>
    <button data-action="tentarDeNovo">Tentar de novo</button>
  </div>` : '';

function hero(subtitulo) {
  return `
    <header class="hero">
      ${logo('brand-logo')}
      <h1>Quem está acessando?</h1>
      <p>${subtitulo}</p>
    </header>`;
}

function cardAtleta(a, novos) {
  return `
    <button class="athlete-card${novos ? ' tem-novo' : ''}" data-action="abrirAtleta" data-id="${esc(a.id)}">
      ${avatar(a.nome)}
      <div class="athlete-info"><div class="athlete-name">${esc(a.nome)}</div></div>
      ${novos ? `<span class="selo-novo">${novos === 1 ? '1 novo' : novos + ' novos'}</span>` : ''}
      <div class="arrow" aria-hidden="true">→</div>
    </button>`;
}

const TIPOS_VIDEO = {
  youtube:   { classe: 'yt', nome: 'YouTube' },
  instagram: { classe: 'ig', nome: 'Instagram' },
};

const ICONE_PLAY = '<span class="play"><svg width="11" height="13" viewBox="0 0 12 14" fill="currentColor"><path d="M0 0L12 7L0 14V0Z"/></svg></span>';

function cardDrill(d, novo) {
  const t = TIPOS_VIDEO[d.tipo];
  // A URL da miniatura é montada só com o ID do vídeo (letras, números, - e _), então é segura no style
  const thumb = t
    ? `<div class="drill-thumb ${t.classe}"${d.thumb ? ` style="background-image:url('${d.thumb}')"` : ''}>${ICONE_PLAY}</div>`
    : '<div class="drill-thumb invalido">?</div>';

  return `
    <button class="drill-card" data-action="abrirDrill" data-id="${esc(d.id)}">
      ${thumb}
      <div class="drill-info">
        <div class="drill-title">${esc(d.titulo)}</div>
        <div class="drill-meta">
          ${novo ? seloNovo : ''}
          <span class="drill-type">${t ? t.nome : 'Link inválido'}${d.atletaId === 'todos' ? ' · Time todo' : ''}</span>
        </div>
      </div>
    </button>`;
}

function cardFeedback(f, { novo = false, destaque = false } = {}) {
  const cat = CATEGORIAS[f.categoria] || CATEGORIAS.positivo;
  return `
    <article class="fb-card${destaque ? ' destacado' : ''}" style="--cat:${cat.cor}">
      <div class="fb-head">
        <div class="fb-tags"><span class="badge">${cat.label}</span>${novo ? seloNovo : ''}</div>
        <span class="fb-date">${esc(f.data ? fmtData(f.data) : f.dataTexto)}</span>
      </div>
      ${f.titulo ? `<h3 class="fb-title">${esc(f.titulo)}</h3>` : ''}
      ${f.texto ? `<p class="fb-text">${esc(f.texto)}</p>` : ''}
      ${f.treinador ? `<div class="fb-coach">👤 ${esc(f.treinador)}</div>` : ''}
    </article>`;
}

/* =========================================================
   TELAS
========================================================= */
function telaSelecao() {
  const vistos = lerVistos();
  const lista = DB.atletas.length
    ? `<div class="athlete-grid">${DB.atletas.map(a => cardAtleta(a, contarNovos(a.id, vistos))).join('')}</div>`
    : vazio('Nenhum atleta na planilha ainda.');

  return `
  <div class="wrap">
    ${avisoDesatualizado()}
    ${hero('Selecione seu nome para abrir o seu painel.')}
    ${lista}
  </div>`;
}

function telaPainel() {
  const atleta = DB.atletas.find(a => a.id === state.atletaId);
  if (!atleta) {
    state.view = 'select';
    return telaSelecao();
  }

  const itens = itensDoAtleta(atleta.id);
  const ids = idsDe(itens);
  if (!state.vistosAoAbrir) state.vistosAoAbrir = new Set(ids);
  marcarVistos(atleta.id, ids);
  const ehNovo = item => !state.vistosAoAbrir.has(item.id);

  const { feedbacks, drills } = itens;
  const [ultimo, ...anteriores] = feedbacks;
  const destaques = feedbacks.filter(f => f.categoria === 'destaque').length;
  const resumo = feedbacks.length
    ? plural(feedbacks.length, 'feedback') + (destaques ? ` · ${plural(destaques, 'destaque')}` : '')
    : 'Nenhum feedback ainda';

  // 1) Último feedback em destaque
  const secaoUltimo = ultimo ? `
    <h3 class="section-title">Último feedback</h3>
    ${cardFeedback(ultimo, { novo: ehNovo(ultimo), destaque: true })}`
    : vazio('Ainda não há feedbacks para você.<br>Eles aparecem aqui assim que o treinador escrever.');

  // 2) Drills
  const secaoDrills = drills.length ? `
    <h3 class="section-title">Drills / Treinos em vídeo</h3>
    <div class="drills-grid">${drills.map(d => cardDrill(d, ehNovo(d))).join('')}</div>` : '';

  // 3) Histórico (sem repetir o último), com contagem em cada filtro
  let secaoAnteriores = '';
  if (anteriores.length) {
    const quantos = id => id === 'all' ? anteriores.length : anteriores.filter(f => f.categoria === id).length;
    const chips = FILTROS.map(c => {
      const n = quantos(c.id);
      const ativo = state.filtro === c.id;
      return `
        <button class="chip${ativo ? ' active' : ''}${n ? '' : ' zero'}" data-action="filtrar" data-filtro="${c.id}"
          aria-pressed="${ativo}">${c.label}<span class="chip-n">${n}</span></button>`;
    }).join('');
    const filtrados = state.filtro === 'all' ? anteriores : anteriores.filter(f => f.categoria === state.filtro);

    secaoAnteriores = `
      <h3 class="section-title">Feedbacks anteriores</h3>
      <div class="chips">${chips}</div>
      ${filtrados.length
        ? filtrados.map(f => cardFeedback(f, { novo: ehNovo(f) })).join('')
        : vazio('Nenhum feedback anterior nesta categoria.')}`;
  }

  return `
  <div class="wrap">
    ${avisoDesatualizado()}
    <div class="topbar">
      <button class="back" data-action="voltar" aria-label="Voltar">←</button>
      ${logo('mini-logo')}
      <div class="id-block">
        ${avatar(atleta.nome)}
        <div class="id-text">
          <h2>${esc(atleta.nome)}</h2>
          <div class="id-sub">${resumo}</div>
        </div>
      </div>
    </div>

    ${secaoUltimo}
    ${secaoDrills}
    ${secaoAnteriores}
  </div>`;
}

function telaCarregando() {
  return `
  <div class="wrap" aria-busy="true">
    ${hero('Carregando atletas…')}
    <div class="athlete-grid">${'<div class="skeleton"></div>'.repeat(6)}</div>
  </div>`;
}

function telaErro() {
  return `
  <div class="wrap estado erro">
    <h2>Não foi possível carregar os dados</h2>
    <p>${esc(state.erro)}</p>
    <button class="btn-primary" data-action="tentarDeNovo">Tentar de novo</button>
  </div>`;
}

// Só aparece se a planilha ainda não foi configurada (mensagem para o treinador)
function telaConfig() {
  return `
  <div class="wrap estado">
    <h2>⚙️ Falta conectar a planilha</h2>
    <p>${state.erro} O passo a passo está no arquivo <code>README.md</code>.</p>
  </div>`;
}

/* =========================================================
   RENDER
========================================================= */
const TELAS = {
  carregando: telaCarregando,
  erro:       telaErro,
  config:     telaConfig,
  ok:         () => (state.view === 'panel' ? telaPainel : telaSelecao)(),
};

function render() {
  const app = document.getElementById('app');
  try {
    app.innerHTML = TELAS[state.status]();
  } catch (e) {
    console.error('Erro no render:', e);
    state.erro = 'Algo deu errado ao montar a página. Tente recarregar.';
    app.innerHTML = telaErro();
  }
}

/* =========================================================
   EVENTOS (delegação: nada de onclick inline no HTML gerado)
========================================================= */
const ACOES = {
  abrirAtleta:  ({ id })     => abrirPainel(id),
  voltar:       ()           => navegar({ view: 'select', atletaId: null }),
  filtrar:      ({ filtro }) => atualizar({ filtro }),
  abrirDrill:   ({ id })     => abrirVideo(DB.drills.find(d => d.id === id)),
  fecharVideo:  ()           => modal.close(),
  tentarDeNovo: ()           => {
    if (state.status === 'erro') atualizar({ status: 'carregando' });
    buscarEAtualizar();
  },
};

document.addEventListener('click', e => {
  if (e.target === modal) return modal.close(); // clique no fundo escuro fora do vídeo
  const el = e.target.closest('[data-action]');
  if (el && Object.hasOwn(ACOES, el.dataset.action)) ACOES[el.dataset.action](el.dataset);
});

// Atleta voltou para a aba depois de um tempo? Busca de novo (no máximo 1x por minuto)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.status === 'ok' && Date.now() - ultimaBusca > 60_000) {
    buscarEAtualizar();
  }
});

/* =========================================================
   INÍCIO
========================================================= */
const logoImg = new Image();
logoImg.onload = () => document.body.classList.add('logo-ok');
logoImg.src = LOGO_SRC;

if (CONFIG.erro) {
  atualizar({ status: 'config', erro: CONFIG.erro });
} else {
  const cache = lerCache();
  if (cache) {
    DB = cache;
    state.status = 'ok'; // mostra a cópia local na hora e atualiza em seguida
  }
  render();
  buscarEAtualizar();
}
</script>
</body>
</html>
